services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pricescope
      POSTGRES_PASSWORD: pricescope
      POSTGRES_DB: pricescope
    ports:
      - "5435:5432"
    volumes:
      - pricescope_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricescope"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pricescope_pgdata:
